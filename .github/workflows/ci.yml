name: CI Check

on:
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Run checks
        run: |
          if uv run pytest; then
            :
          else
            pytest_status=$?
            if [ "$pytest_status" -ne 5 ]; then
              exit "$pytest_status"
            fi
          fi
          uv run ruff check .
